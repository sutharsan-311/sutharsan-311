<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
<defs><style>
 .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
 .bot{animation:d 7s ease-in-out infinite} @keyframes d{0%{transform:translateX(0)}70%,100%{transform:translateX(900px)}}
 .done{animation:o 7s steps(1) infinite} @keyframes o{0%,69%{opacity:0}70%,96%{opacity:1}97%,100%{opacity:0}}
 .wait{animation:w 7s steps(1) infinite} @keyframes w{0%,69%{opacity:1}70%,100%{opacity:0}}
 .route{stroke-dasharray:6 8;animation:r 1.2s linear infinite} @keyframes r{to{stroke-dashoffset:-28}}
 .flag{animation:f .6s ease-in-out infinite alternate;transform-origin:1062px 78px} @keyframes f{to{transform:skewY(-8deg)}}
</style></defs>
<rect width="1200" height="150" fill="#050505"/>
<g stroke="#ffb347" stroke-opacity=".05"><line x1="0" y1="0" x2="0" y2="150"/><line x1="40" y1="0" x2="40" y2="150"/><line x1="80" y1="0" x2="80" y2="150"/><line x1="120" y1="0" x2="120" y2="150"/><line x1="160" y1="0" x2="160" y2="150"/><line x1="200" y1="0" x2="200" y2="150"/><line x1="240" y1="0" x2="240" y2="150"/><line x1="280" y1="0" x2="280" y2="150"/><line x1="320" y1="0" x2="320" y2="150"/><line x1="360" y1="0" x2="360" y2="150"/><line x1="400" y1="0" x2="400" y2="150"/><line x1="440" y1="0" x2="440" y2="150"/><line x1="480" y1="0" x2="480" y2="150"/><line x1="520" y1="0" x2="520" y2="150"/><line x1="560" y1="0" x2="560" y2="150"/><line x1="600" y1="0" x2="600" y2="150"/><line x1="640" y1="0" x2="640" y2="150"/><line x1="680" y1="0" x2="680" y2="150"/><line x1="720" y1="0" x2="720" y2="150"/><line x1="760" y1="0" x2="760" y2="150"/><line x1="800" y1="0" x2="800" y2="150"/><line x1="840" y1="0" x2="840" y2="150"/><line x1="880" y1="0" x2="880" y2="150"/><line x1="920" y1="0" x2="920" y2="150"/><line x1="960" y1="0" x2="960" y2="150"/><line x1="1000" y1="0" x2="1000" y2="150"/><line x1="1040" y1="0" x2="1040" y2="150"/><line x1="1080" y1="0" x2="1080" y2="150"/><line x1="1120" y1="0" x2="1120" y2="150"/><line x1="1160" y1="0" x2="1160" y2="150"/><line x1="1200" y1="0" x2="1200" y2="150"/></g>
<line x1="110" y1="100" x2="1060" y2="100" stroke="#ffb347" stroke-width="2" class="route" opacity=".7"/>
<g class="bot">
  <rect x="98" y="88" width="24" height="24" rx="5" fill="#ffb347"/>
  <rect x="106" y="96" width="8" height="8" rx="2" fill="#0b0906"/>
</g>
<line x1="1062" y1="40" x2="1062" y2="112" stroke="#f3e9dc" stroke-width="2"/>
<path d="M1062 40 L1100 50 L1062 60 Z" fill="#ffb347" class="flag"/>
<text x="1080" y="128" class="t" font-size="12" fill="#8a7b6a" text-anchor="middle">goal: you, following</text>
<text x="100" y="50" class="t wait" font-size="15" fill="#8a7b6a">[nav2] planning route to your follow button...</text>
<text x="100" y="50" class="t done" font-size="15" fill="#ffb347">[nav2] goal reached ✓  thanks for scrolling this far</text>
</svg>
